name: run_tests

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fzed:
    name: FZed Fossil integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fossil
          ./script/linux

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          fossil version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check focused FZed packages
        run: cargo check -p git -p project -p git_ui -p proto -p editor -p agent_ui

      - name: Test Fossil backend
        run: cargo test -p git fossil --lib

      - name: Test Fossil project state
        run: cargo test -p project fossil --lib

      - name: Test Fossil project integration
        run: cargo test -p project --test integration test_add_path_to_fossil_ignore_glob

      - name: Test Fossil UI
        run: cargo test -p git_ui fossil --lib

      - name: Test Fossil worktree integration
        run: cargo test -p worktree --features test-support --test integration fossil

      - name: Test repository update protocol
        run: cargo test -p proto split_repository_update

      - name: Check diff whitespace
        run: git diff --check
